# Application Name
spring.application.name=auth-service

server.port = 8081

# Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=c##auth_schema
spring.datasource.password=auth123

spring.security.user.name=rohith
spring.security.user.password=rohith123


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Eureka Instance Configuration
#eureka.instance.prefer-ip-address=true
#eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT Configuration
jwt.secret=your_secret_key_here_change_this_in_production_with_at_least_256_bits_for_hs256_algorithm
jwt.expiration=86400000

# Logging Configuration
logging.level.com.hsms.auth=DEBUG