spring.application.name=api-gateway

server.port=8080

app.jwt-secret=VGhpc0lzTXlTZWNyZXRLZXlGb3JKV1RUb2tlbjEyMzQ1Njc4OTA=

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=lb://HSMS-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# USER SERVICE - CUSTOMERS
spring.cloud.gateway.routes[1].id=USER-CUSTOMERS
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/api/customers/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# USER SERVICE - TECHNICIANS
spring.cloud.gateway.routes[2].id=USER-TECHNICIANS
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/api/technicians/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# BOOKING SERVICE
spring.cloud.gateway.routes[3].id=BOOKING-SERVICE
spring.cloud.gateway.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/service-requests/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter