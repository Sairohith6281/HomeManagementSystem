# Server Configuration
server.port=8080

# Application Name
spring.application.name=api-gateway

# Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# User Service Route
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Catalog Service Route
spring.cloud.gateway.routes[2].id=catalog-service
spring.cloud.gateway.routes[2].uri=lb://catalog-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/categories/**

# Booking Service Route
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://booking-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/service-requests/**

# Assignment Service Route
spring.cloud.gateway.routes[4].id=assignment-service
spring.cloud.gateway.routes[4].uri=lb://assignment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/assignments/**

# Execution Service Route
spring.cloud.gateway.routes[5].id=execution-service
spring.cloud.gateway.routes[5].uri=lb://execution-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/services/**

# Payment Service Route
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://payment-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**

# Feedback Service Route
spring.cloud.gateway.routes[7].id=feedback-service
spring.cloud.gateway.routes[7].uri=lb://feedback-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/feedbacks/**

# Report Service Route
spring.cloud.gateway.routes[8].id=report-service
spring.cloud.gateway.routes[8].uri=lb://report-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/reports/**

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Actuator Management
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.gateway.access=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.hsms.gateway=DEBUG